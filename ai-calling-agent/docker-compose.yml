services:
  api:
    build: ./api
    ports:
      - '8000:8000'
    depends_on:
      - whisper
      - ollama
      - tts
      - redis
    env_file:
      - .env

  whisper:
    build: ./whisper
    ports:
      - '5001:5001'

  tts:
    build: ./tts
    ports:
      - '5002:5002'

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

volumes:
  ollama:
